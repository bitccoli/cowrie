# fly.toml app configuration file generated for cowrie-buoyant-cherry-2408 on 2026-11-27T02:56:54+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cowrie-cashu'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  RUST_LOG = 'info'

[[mounts]]
  source = 'cowrie_data'
  destination = '/data'

[http_service]
  internal_port = 3338
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    method = 'GET'
    path = '/v1/info'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
