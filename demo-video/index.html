<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Cowrie — 75s Motion Graphics Demo Studio (1080p Canvas + WebAudio)</title>
<style>
  * { box-sizing: border-box; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { margin: 0; background: #05080f; color: #e6edf7; display: flex; flex-direction: column; align-items: center; padding: 16px; min-height: 100vh; }
  .bar { width: 100%; max-width: 1280px; display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; }
  .controls { display: flex; gap: 8px; align-items: center; }
  button { cursor: pointer; border: 1px solid #26344d; background: #131c2e; color: #e6edf7; padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; }
  button:hover { border-color: #38bdf8; }
  button.primary { background: #38bdf8; color: #05131f; border-color: #38bdf8; }
  button.rec { background: #ef4444; color: #fff; border-color: #ef4444; }
  canvas { width: 100%; max-width: 1280px; aspect-ratio: 16/9; border: 1px solid #1f2b40; border-radius: 12px; background: #0b0f17; box-shadow: 0 24px 60px rgba(0,0,0,0.65); }
  input[type=range] { width: 320px; accent-color: #38bdf8; }
  .meta { font-family: ui-monospace, monospace; font-size: 13px; color: #8b9bb4; }
</style>
</head>
<body>
<div class="bar">
  <div class="controls">
    <button class="primary" id="play-btn" onclick="togglePlay()">▶ Play 75s Demo</button>
    <button onclick="seekTo(0)">↺ Restart</button>
    <button class="rec" id="rec-btn" onclick="recordFullVideo()">● Export 1080p WebM + Music</button>
  </div>
  <div class="controls">
    <input type="range" id="scrubber" min="0" max="75" step="0.05" value="0" oninput="seekTo(parseFloat(this.value))"/>
    <span class="meta" id="time-label">00:00.0 / 01:15.0</span>
  </div>
</div>
<canvas id="stage" width="1920" height="1080"></canvas>

<script>
// Pure HTML5 Canvas 2D + WebAudio imperative motion engine (zero React / Remotion overhead!)
const W = 1920, H = 1080, DURATION = 75.0;
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

const SUBTITLES = [
  [0.4, 7.8, "Meet Cowrie — an independent clean-room Rust implementation of Federated Cashu (BLS12-381)."],
  [8.2, 17.6, "Federation security demands client diversity. One shared codebase means one bug breaks every guardian."],
  [18.0, 29.6, "Cowrie's pluggable CashuConsensusBox separates total-order finality from signing — effortless to operate standalone or on-chain."],
  [30.0, 41.6, "Byzantine guardian forging shares? Bilinear pairing checks reject it in real time while 4-of-5 keeps issuing."],
  [42.0, 53.6, "No NUT-12 DLEQ bloat: 32.6% smaller cashuB tokens, 1.2ms offline verify, and 4.8x faster batch settlement."],
  [54.0, 64.6, "One shared Blind-Seal threshold core powers both Cashu and Fedimint — unified guardians, two eCash ecosystems."],
  [65.0, 74.8, "Open source, 25/25 tests passing, ready to run locally or on Fly.io. Try Cowrie today."]
];

// Easing primitives
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const easeOutCubic = t => 1 - Math.pow(1 - clamp(t), 3);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1, x = clamp(t); return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeInOut = t => { const x = clamp(t); return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2; };
const seg = (t, t0, dur) => clamp((t - t0) / dur);

function roundRect(x, y, w, h, r, fill, stroke, lw = 2) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

function drawGrid(t) {
  const grad = ctx.createRadialGradient(W*0.5, H*0.42, 80, W*0.5, H*0.5, W*0.72);
  grad.addColorStop(0, '#111b2e');
  grad.addColorStop(1, '#070b13');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(56, 189, 248, 0.045)';
  ctx.lineWidth = 1;
  const off = (t * 18) % 64;
  for (let x = -64 + off; x < W; x += 64) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = -64 + off; y < H; y += 64) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
}

function drawHeader(tag, title, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  roundRect(110, 74, ctx.measureText(tag).width + 130, 42, 21, 'rgba(56,189,248,0.14)', 'rgba(56,189,248,0.45)', 1.5);
  ctx.fillStyle = '#38bdf8';
  ctx.font = '700 20px ui-monospace, monospace';
  ctx.fillText(tag, 136, 102);

  ctx.fillStyle = '#f1f5f9';
  ctx.font = '800 54px ui-sans-serif, system-ui, sans-serif';
  ctx.fillText(title, 110, 182);
  ctx.restore();
}

function drawSubtitle(t) {
  const active = SUBTITLES.find(([s, e]) => t >= s && t <= e);
  if (!active) return;
  const [s, e, text] = active;
  const fade = Math.min(seg(t, s, 0.35), seg(e - t, 0, 0.35));
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.font = '600 32px ui-sans-serif, system-ui, sans-serif';
  const maxW = 1540;
  // Word wrap cleanly into 1 or 2 lines
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);

  const boxH = lines.length * 44 + 34;
  const boxW = Math.min(maxW + 80, Math.max(...lines.map(l => ctx.measureText(l).width)) + 84);
  const bx = (W - boxW) / 2, by = H - boxH - 44;
  roundRect(bx, by, boxW, boxH, 16, 'rgba(5, 9, 18, 0.88)', 'rgba(56, 189, 248, 0.32)', 1.5);
  ctx.fillStyle = '#f8fafc';
  ctx.textAlign = 'center';
  lines.forEach((l, idx) => ctx.fillText(l, W / 2, by + 48 + idx * 44));
  ctx.restore();
}

function drawProgressBar(t) {
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(0, H - 6, W, 6);
  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(0, H - 6, W * (t / DURATION), 6);
}

// Scene 1 (0-8s): Hero Title + 4-of-5 BLS12-381 Mesh
function renderScene1(t) {
  const p = easeOutBack(seg(t, 0.2, 1.1));
  const fadeOut = 1 - seg(t, 7.4, 0.6);
  ctx.save();
  ctx.globalAlpha = fadeOut;

  // Animated 5-node pentagon threshold mesh on the right
  const cx = 1380, cy = 470, rad = 220 * easeOutCubic(seg(t, 0.5, 1.2));
  const pts = [];
  for (let i = 0; i < 5; i++) {
    const ang = -Math.PI/2 + i * (Math.PI * 2 / 5) + t * 0.12;
    pts.push([cx + Math.cos(ang)*rad, cy + Math.sin(ang)*rad]);
  }
  ctx.strokeStyle = 'rgba(56,189,248,0.35)';
  ctx.lineWidth = 2.5;
  for (let i = 0; i < 5; i++) for (let j = i+1; j < 5; j++) {
    ctx.beginPath(); ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[j][0], pts[j][1]); ctx.stroke();
  }
  pts.forEach(([x, y], i) => {
    const pulse = 1 + 0.08 * Math.sin(t * 4 + i);
    ctx.beginPath(); ctx.arc(x, y, 40 * pulse, 0, Math.PI*2);
    ctx.fillStyle = '#0f1b2e'; ctx.fill();
    ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#e2e8f0'; ctx.font = '700 22px ui-monospace, monospace'; ctx.textAlign = 'center';
    ctx.fillText(`G${i}`, x, y + 8);
  });
  ctx.fillStyle = '#38bdf8'; ctx.font = '700 26px ui-monospace, monospace'; ctx.textAlign = 'center';
  ctx.fillText('4-of-5 BLS12-381', cx, cy + 10);

  // Left hero title
  ctx.textAlign = 'left';
  ctx.fillStyle = '#38bdf8';
  ctx.font = '700 24px ui-monospace, monospace';
  ctx.fillText('NUT NOVEMBER 2026 • CLEAN-ROOM RUST', 130, 320);

  ctx.fillStyle = '#f8fafc';
  ctx.font = `900 ${Math.round(124 * Math.min(1, p))}px ui-sans-serif, system-ui, sans-serif`;
  ctx.fillText('COWRIE', 124, 452);

  ctx.fillStyle = '#94a3b8';
  ctx.font = '500 36px ui-sans-serif, system-ui, sans-serif';
  ctx.fillText('Independent Federated Cashu Mint', 130, 524);
  ctx.fillText('& Shared Blind-Seal Threshold Engine', 130, 574);

  const pills = ['4-of-5 BLS12-381', 'CashuConsensusBox', 'Zero-DLEQ HTTP-402', 'Cashu + Fedimint'];
  pills.forEach((label, idx) => {
    const a = easeOutCubic(seg(t, 1.4 + idx * 0.25, 0.6));
    ctx.save(); ctx.globalAlpha = a * fadeOut;
    const x = 130 + (idx % 2) * 340, y = 635 + Math.floor(idx / 2) * 66;
    roundRect(x, y, 315, 50, 25, 'rgba(34,197,94,0.12)', 'rgba(34,197,94,0.45)', 1.5);
    ctx.fillStyle = '#4ade80'; ctx.font = '700 21px ui-monospace, monospace';
    ctx.fillText('✓ ' + label, x + 24, y + 32);
    ctx.restore();
  });
  ctx.restore();
}

// Scene 2 (8-18s): Client Diversity & Independent Implementations
function renderScene2(t) {
  const lt = t - 8.0;
  const alpha = Math.min(seg(lt, 0, 0.5), 1 - seg(lt, 9.4, 0.6));
  drawHeader('01 / CLIENT DIVERSITY', 'Why Independent Implementations Matter', alpha);
  ctx.save(); ctx.globalAlpha = alpha;

  // Left card: Monoculture failure
  roundRect(110, 240, 780, 620, 20, 'rgba(239,68,68,0.06)', 'rgba(239,68,68,0.35)', 2);
  ctx.fillStyle = '#f87171'; ctx.font = '700 28px ui-sans-serif, sans-serif';
  ctx.fillText('✕  Single-Implementation Monoculture', 150, 305);
  ctx.fillStyle = '#94a3b8'; ctx.font = '500 22px ui-sans-serif, sans-serif';
  ctx.fillText('All 5 guardians run the same codebase', 150, 345);

  const bugTriggered = lt > 3.0;
  for (let i = 0; i < 5; i++) {
    const x = 160 + i * 136, y = 440;
    const red = bugTriggered ? easeOutCubic(seg(lt, 3.0 + i * 0.12, 0.4)) : 0;
    roundRect(x, y, 114, 150, 14, red > 0.2 ? 'rgba(239,68,68,0.22)' : '#121b2d', red > 0.2 ? '#ef4444' : '#334155', 2);
    ctx.fillStyle = red > 0.2 ? '#fca5a5' : '#cbd5e1'; ctx.font = '700 20px ui-monospace, monospace'; ctx.textAlign = 'center';
    ctx.fillText(`G${i}`, x + 57, y + 48);
    ctx.font = '600 17px ui-monospace, monospace';
    ctx.fillText('Impl A', x + 57, y + 86);
    ctx.fillStyle = red > 0.2 ? '#ef4444' : '#64748b';
    ctx.fillText(red > 0.2 ? 'HALTED' : 'ONLINE', x + 57, y + 124);
  }
  ctx.textAlign = 'left';
  if (bugTriggered) {
    ctx.fillStyle = '#fca5a5'; ctx.font = '700 24px ui-monospace, monospace';
    ctx.fillText('! 1 cryptographic/state bug => 5/5 guardians fail together', 150, 700);
  }

  // Right card: Multi-implementation diversity with Cowrie
  const rAppear = easeOutCubic(seg(lt, 1.2, 0.8));
  ctx.globalAlpha = alpha * rAppear;
  roundRect(960, 240, 850, 620, 20, 'rgba(34,197,94,0.06)', 'rgba(34,197,94,0.45)', 2);
  ctx.fillStyle = '#4ade80'; ctx.font = '700 28px ui-sans-serif, sans-serif';
  ctx.fillText('✓  Diverse Independent Implementations', 1000, 305);
  ctx.fillStyle = '#94a3b8'; ctx.font = '500 22px ui-sans-serif, sans-serif';
  ctx.fillText('Clean-room Cowrie joins CDK / Nutshell / custom guardians', 1000, 345);

  const impls = ['Impl A', 'Cowrie', 'Cowrie', 'Impl B', 'Cowrie'];
  for (let i = 0; i < 5; i++) {
    const x = 1005 + i * 154, y = 440;
    const isFaulty = bugTriggered && i === 0;
    const isCowrie = impls[i] === 'Cowrie';
    const border = isFaulty ? '#f59e0b' : (isCowrie ? '#38bdf8' : '#22c55e');
    const bg = isFaulty ? 'rgba(245,158,11,0.16)' : (isCowrie ? 'rgba(56,189,248,0.16)' : 'rgba(34,197,94,0.12)');
    roundRect(x, y, 132, 150, 14, bg, border, 2.5);
    ctx.fillStyle = '#f8fafc'; ctx.font = '700 20px ui-monospace, monospace'; ctx.textAlign = 'center';
    ctx.fillText(`G${i}`, x + 66, y + 48);
    ctx.fillStyle = isCowrie ? '#38bdf8' : '#e2e8f0';
    ctx.fillText(impls[i], x + 66, y + 86);
    ctx.fillStyle = isFaulty ? '#fbbf24' : '#4ade80';
    ctx.fillText(isFaulty ? 'ISOLATED' : 'SIGNING', x + 66, y + 124);
  }
  ctx.textAlign = 'left';
  ctx.fillStyle = '#86efac'; ctx.font = '700 24px ui-monospace, monospace';
  ctx.fillText('✓ 4-of-5 quorum stays live • Spec edge cases caught early', 1000, 700);
  ctx.fillStyle = '#94a3b8'; ctx.font = '500 21px ui-sans-serif, sans-serif';
  ctx.fillText('Includes NUT-BLS spec notes: min-sig G1, 48B Ys, Fiat-Shamir MSM', 1000, 748);
  ctx.restore();
}

// Scene 3 (18-30s): Pluggable CashuConsensusBox — Easy to Operate
function renderScene3(t) {
  const lt = t - 18.0;
  const alpha = Math.min(seg(lt, 0, 0.5), 1 - seg(lt, 11.4, 0.6));
  drawHeader('02 / OPERATIONAL SIMPLICITY', 'Pluggable CashuConsensusBox Architecture', alpha);
  ctx.save(); ctx.globalAlpha = alpha;

  // Left: Wallet / REST
  roundRect(110, 340, 340, 320, 18, '#10192b', '#38bdf8', 2.5);
  ctx.fillStyle = '#38bdf8'; ctx.font = '700 26px ui-monospace, monospace'; ctx.textAlign = 'center';
  ctx.fillText('cowried', 280, 410);
  ctx.fillStyle = '#cbd5e1'; ctx.font = '500 22px ui-sans-serif, sans-serif';
  ctx.fillText('Standard Cashu REST', 280, 460);
  ctx.fillText('+ NUT-17 /v1/ws', 280, 495);
  ctx.fillText('+ Browser WASM UI', 280, 530);
  ctx.fillStyle = '#4ade80'; ctx.font = '700 20px ui-monospace, monospace';
  ctx.fillText('1 binary • zero BFT ops', 280, 600);

  // Center: CashuConsensusBox trait
  roundRect(575, 250, 620, 590, 22, 'rgba(56,189,248,0.07)', '#38bdf8', 3);
  ctx.fillStyle = '#f8fafc'; ctx.font = '800 30px ui-monospace, monospace';
  ctx.fillText('trait CashuConsensusBox', 885, 310);
  ctx.fillStyle = '#94a3b8'; ctx.font = '500 21px ui-sans-serif, sans-serif';
  ctx.fillText('Total-order nullifiers BEFORE guardians sign (0 bricked notes)', 885, 348);

  const modeSui = lt > 5.5;
  // Option A: EmbeddedMoveEngine
  roundRect(620, 390, 530, 185, 16, !modeSui ? 'rgba(34,197,94,0.18)' : '#0d1422', !modeSui ? '#22c55e' : '#334155', !modeSui ? 3 : 1.5);
  ctx.textAlign = 'left';
  ctx.fillStyle = !modeSui ? '#4ade80' : '#94a3b8'; ctx.font = '700 24px ui-monospace, monospace';
  ctx.fillText('Mode A: EmbeddedMoveEngine', 650, 442);
  ctx.fillStyle = '#cbd5e1'; ctx.font = '500 20px ui-sans-serif, sans-serif';
  ctx.fillText('• Atomic CBOR disk snapshots (--data-dir)', 650, 484);
  ctx.fillText('• Instant standalone Bitcoin / LNbits mint', 650, 518);
  ctx.fillText('• 50-way swap race test: 1 win, 49 rejected', 650, 552);

  // Option B: LiveSuiJsonRpcBackend
  roundRect(620, 610, 530, 195, 16, modeSui ? 'rgba(56,189,248,0.20)' : '#0d1422', modeSui ? '#38bdf8' : '#334155', modeSui ? 3 : 1.5);
  ctx.fillStyle = modeSui ? '#38bdf8' : '#94a3b8'; ctx.font = '700 24px ui-monospace, monospace';
  ctx.fillText('Mode B: Sui Move MintVault<Asset>', 650, 662);
  ctx.fillStyle = '#cbd5e1'; ctx.font = '500 20px ui-sans-serif, sans-serif';
  ctx.fillText('• Flip --sui-rpc & --vault-object-id', 650, 704);
  ctx.fillText('• Public Proof-of-Reserves & hourly melt cap', 650, 738);
  ctx.fillText('• On-chain 120-bit Fiat-Shamir BLS pairings', 650, 772);

  // Right: Stateless Blind-Seal Guardians
  roundRect(1320, 340, 480, 320, 18, '#10192b', '#a855f7', 2.5);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#c084fc'; ctx.font = '700 26px ui-monospace, monospace';
  ctx.fillText('5x Stateless Guardians', 1560, 410);
  ctx.fillStyle = '#cbd5e1'; ctx.font = '500 22px ui-sans-serif, sans-serif';
  ctx.fillText('No consensus log to maintain', 1560, 462);
  ctx.fillText('Verify BlindSigningTicket', 1560, 498);
  ctx.fillText('Return BLS12-381 G1 share', 1560, 534);
  ctx.fillStyle = '#e9d5ff'; ctx.font = '700 20px ui-monospace, monospace';
  ctx.fillText('2-Round HTTP Pedersen DKG', 1560, 600);

  // Animated flow arrows
  const pulseX1 = 450 + ((lt * 160) % 125);
  const pulseX2 = 1195 + ((lt * 160) % 125);
  ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(450, 500); ctx.lineTo(575, 500); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(1195, 500); ctx.lineTo(1320, 500); ctx.stroke();
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath(); ctx.arc(pulseX1, 500, 8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(pulseX2, 500, 8, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// Scene 4 (30-42s): 4-of-5 Guardian Chaos & Byzantine Share Rejection
function renderScene4(t) {
  const lt = t - 30.0;
  const alpha = Math.min(seg(lt, 0, 0.5), 1 - seg(lt, 11.4, 0.6));
  drawHeader('03 / BYZANTINE FAULT TOLERANCE', '4-of-5 Live Guardian Chaos & Pairing Verification', alpha);
  ctx.save(); ctx.globalAlpha = alpha;

  const isByz = lt > 1.8;
  const shareChecked = lt > 4.2;

  for (let i = 0; i < 5; i++) {
    const x = 115 + i * 342, y = 260;
    const byz = isByz && i === 0;
    const border = byz ? '#f59e0b' : '#22c55e';
    const bg = byz ? 'rgba(245,158,11,0.14)' : 'rgba(34,197,94,0.09)';
    roundRect(x, y, 312, 260, 18, bg, border, 3);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f8fafc'; ctx.font = '800 28px ui-sans-serif, sans-serif';
    ctx.fillText(`Guardian #${i}`, x + 156, y + 58);

    roundRect(x + 48, y + 84, 216, 42, 21, byz ? 'rgba(245,158,11,0.25)' : 'rgba(34,197,94,0.22)', border, 1.5);
    ctx.fillStyle = byz ? '#fbbf24' : '#4ade80'; ctx.font = '700 20px ui-monospace, monospace';
    ctx.fillText(byz ? 'BYZANTINE FORGE' : 'HEALTHY', x + 156, y + 112);

    ctx.fillStyle = '#cbd5e1'; ctx.font = '600 19px ui-monospace, monospace';
    if (byz) {
      ctx.fillText(shareChecked ? 'Forged G1: CAUGHT!' : 'Sending bad G1...', x + 156, y + 178);
      ctx.fillStyle = '#f87171';
      ctx.fillText(shareChecked ? 'e(S\'0,G2) != e(B_,PK0)' : 'Tampered share', x + 156, y + 218);
    } else {
      ctx.fillText(shareChecked ? 'Pairing: VERIFIED ✓' : 'Signing B_...', x + 156, y + 178);
      ctx.fillStyle = '#4ade80';
      ctx.fillText(shareChecked ? 'Lagrange Share OK' : 'Valid G1 Share', x + 156, y + 218);
    }
  }

  // Bottom verification panel
  roundRect(115, 575, 1690, 275, 20, '#0e1626', shareChecked ? '#38bdf8' : '#26344d', 2.5);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#38bdf8'; ctx.font = '700 24px ui-monospace, monospace';
  ctx.fillText('NON-CUSTODIAL BROWSER WASM (cowrie_bls.wasm • 107 KB)', 155, 635);

  ctx.fillStyle = '#f8fafc'; ctx.font = '600 26px ui-monospace, monospace';
  ctx.fillText('1. Blind B_ = r · H_G1(secret) locally in browser WASM (0 secrets sent)', 155, 692);
  ctx.fillStyle = shareChecked ? '#fbbf24' : '#94a3b8';
  ctx.fillText('2. Guardian #0 forged share rejected automatically -> {1, 2, 3, 4} reach 4-of-5 quorum!', 155, 742);
  ctx.fillStyle = shareChecked ? '#4ade80' : '#94a3b8';
  ctx.fillText('3. Unblind C & verify e(C, G2) == e(H_G1(secret), PK_G2) offline + NUT-13 seed restore ✓', 155, 792);
  ctx.restore();
}

// Scene 5 (42-54s): Zero-DLEQ V4V HTTP-402 & Measured Benchmarks
function renderScene5(t) {
  const lt = t - 42.0;
  const alpha = Math.min(seg(lt, 0, 0.5), 1 - seg(lt, 11.4, 0.6));
  drawHeader('04 / MEASURED BENCHMARKS', 'Zero-DLEQ HTTP-402 Streaming & Batch Pairing Speedup', alpha);
  ctx.save(); ctx.globalAlpha = alpha;

  const grow = easeOutCubic(seg(lt, 0.6, 1.4));

  // Left: Token size comparison (256 notes)
  roundRect(110, 250, 820, 580, 20, '#0e1626', '#26344d', 2);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#e2e8f0'; ctx.font = '700 28px ui-sans-serif, sans-serif';
  ctx.fillText('NUT-00 V4 cashuB Token Size (256 Notes)', 150, 315);

  // Legacy bar
  ctx.fillStyle = '#94a3b8'; ctx.font = '600 22px ui-monospace, monospace';
  ctx.fillText('secp256k1 BDHKE + NUT-12 DLEQ (97 B/sig)', 150, 395);
  roundRect(150, 415, 700 * grow, 68, 12, 'rgba(148,163,184,0.28)', '#64748b', 2);
  ctx.fillStyle = '#f8fafc'; ctx.font = '700 26px ui-monospace, monospace';
  ctx.fillText('62,877 B', 175 + 520 * grow, 458);

  // Cowrie bar
  ctx.fillStyle = '#38bdf8'; ctx.font = '700 22px ui-monospace, monospace';
  ctx.fillText('Cowrie BLS12-381 min-sig (48 B/sig • 0 B DLEQ)', 150, 555);
  roundRect(150, 575, 472 * grow, 68, 12, 'rgba(56,189,248,0.32)', '#38bdf8', 2.5);

// WebAudio warm ambient soundtrack generator (also routed into MediaRecorder for video export!)
let audioCtx = null, audioDest = null, audioTimer = null;
const CHORDS = [
  [146.83, 220.00, 261.63, 329.63],
  [116.54, 174.61, 220.00, 293.66],
  [174.61, 220.00, 261.63, 329.63],
  [130.81, 196.00, 261.63, 293.66]
];
function startMusic(startOffsetSec) {
  stopMusic();
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const master = audioCtx.createGain();
  master.gain.setValueAtTime(0.001, audioCtx.currentTime);
  master.gain.exponentialRampToValueAtTime(0.28, audioCtx.currentTime + 1.5);
  master.connect(audioCtx.destination);
  audioDest = audioCtx.createMediaStreamDestination();
  master.connect(audioDest);

  let step = Math.floor(startOffsetSec / 5.0);
  const triggerChord = () => {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const notes = CHORDS[step % CHORDS.length];
    notes.forEach((f, idx) => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = idx === 0 ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(f, now);
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(idx === 0 ? 0.22 : 0.12, now + 1.2);
      g.gain.linearRampToValueAtTime(0.001, now + 4.95);
      osc.connect(g); g.connect(master);
      osc.start(now); osc.stop(now + 5.0);
    });
    step++;
  };
  triggerChord();
  audioTimer = setInterval(triggerChord, 5000);
}
function stopMusic() {
  if (audioTimer) { clearInterval(audioTimer); audioTimer = null; }
  if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; audioDest = null; }
}

let playing = false, currentT = 0, lastTs = null;
function fmtTime(s) {
  const m = Math.floor(s / 60), rem = (s % 60).toFixed(1).padStart(4, '0');
  return `${String(m).padStart(2,'0')}:${rem}`;
}
function updateUi() {
  document.getElementById('scrubber').value = currentT;
  document.getElementById('time-label').textContent = `${fmtTime(currentT)} / ${fmtTime(DURATION)}`;
}
function seekTo(sec) {
  currentT = clamp(sec, 0, DURATION);
  renderFrame(currentT);
  updateUi();
}
function loop(ts) {
  if (!playing) return;
  if (lastTs === null) lastTs = ts;
  currentT += (ts - lastTs) / 1000;
  lastTs = ts;
  if (currentT >= DURATION) {
    currentT = DURATION;
    renderFrame(currentT);
    updateUi();
    togglePlay(false);
    return;
  }
  renderFrame(currentT);
  updateUi();
  requestAnimationFrame(loop);
}
function togglePlay(force) {
  playing = force !== undefined ? force : !playing;
  document.getElementById('play-btn').textContent = playing ? '⏸ Pause' : '▶ Play 75s Demo';
  if (playing) {
    if (currentT >= DURATION) currentT = 0;
    lastTs = null;
    startMusic(currentT);
    requestAnimationFrame(loop);
  } else {
    stopMusic();
  }
}

async function recordFullVideo() {
  const btn = document.getElementById('rec-btn');
  btn.disabled = true;
  btn.textContent = '● Recording 75s 1080p...';
  currentT = 0;
  lastTs = null;
  playing = true;
  document.getElementById('play-btn').textContent = '⏸ Pause';
  startMusic(0);

  const vStream = canvas.captureStream(60);
  const combined = new MediaStream([
    ...vStream.getVideoTracks(),
    ...(audioDest ? audioDest.stream.getAudioTracks() : [])
  ]);
  const rec = new MediaRecorder(combined, { mimeType: 'video/webm;codecs=vp9,opus', videoBitsPerSecond: 8_000_000 });
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cowrie-demo.webm';
    a.click();
    btn.disabled = false;
    btn.textContent = '● Export 1080p WebM + Music';
  };
  rec.start();
  requestAnimationFrame(loop);
  setTimeout(() => { if (rec.state !== 'inactive') rec.stop(); }, (DURATION + 0.4) * 1000);
}

renderFrame(0);
updateUi();
