name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-workspace:
    name: Rust Tests, Binaries & WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run workspace unit & integration tests
        run: cargo test --workspace

      - name: Build all workspace binaries
        run: cargo build --workspace --bins

      - name: Build browser BLS12-381 WASM module
        run: |
          cargo build \
            --manifest-path blind-seal/wasm/cowrie-bls-wasm/Cargo.toml \
            --target wasm32-unknown-unknown \
            --release

      - name: Run cowrie-bench smoke check
        run: cargo run -p cowrie-cashu-mintd --bin cowrie-bench
